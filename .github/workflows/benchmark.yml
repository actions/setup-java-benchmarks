name: Benchmark setup-java

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Independent cold/warm samples per combination
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
        default: "3"
      java-version:
        description: Java feature version
        required: true
        type: string
        default: "17"
      cleanup-caches:
        description: Delete benchmark caches after measuring them
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

env:
  PETCLINIC_REF: f182358d02e4a68e52bdbabf55ca7800288511e7

concurrency:
  group: setup-java-benchmark
  cancel-in-progress: false

jobs:
  v1-cold:
    name: v1 / cold / zulu / ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJSON(inputs.iterations == '5' && '[1,2,3,4,5]' || inputs.iterations == '3' && '[1,2,3]' || '[1]') }}
    steps:
      - name: Check out Spring PetClinic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spring-projects/spring-petclinic
          ref: ${{ env.PETCLINIC_REF }}
          persist-credentials: false
      - name: Setup Java v1
        uses: actions/setup-java@v1.4.4
        with:
          java-version: ${{ inputs.java-version }}
      - name: Record Java environment
        run: java -XshowSettings:properties -version 2>&1 | grep -E 'java.home|java.vendor|java.version'
      - name: Build PetClinic
        run: ./mvnw --batch-mode --no-transfer-progress compile

  v2-cold:
    name: v2 / cold / ${{ matrix.distribution }} / ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [temurin, microsoft]
        iteration: ${{ fromJSON(inputs.iterations == '5' && '[1,2,3,4,5]' || inputs.iterations == '3' && '[1,2,3]' || '[1]') }}
    steps:
      - name: Check out Spring PetClinic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spring-projects/spring-petclinic
          ref: ${{ env.PETCLINIC_REF }}
          persist-credentials: false
      - name: Isolate benchmark caches
        env:
          BENCHMARK_ID: v2-${{ matrix.distribution }}-${{ matrix.iteration }}-${{ github.run_id }}
        run: printf '<!-- benchmark-id=%s -->\n' "$BENCHMARK_ID" >> pom.xml
      - name: Setup Java v2
        uses: actions/setup-java@v2.5.1
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Record Java environment
        run: java -XshowSettings:properties -version 2>&1 | grep -E 'java.home|java.vendor|java.version'
      - name: Build PetClinic
        run: ./mvnw --batch-mode --no-transfer-progress compile

  v3-cold:
    name: v3 / cold / ${{ matrix.distribution }} / ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [temurin, microsoft]
        iteration: ${{ fromJSON(inputs.iterations == '5' && '[1,2,3,4,5]' || inputs.iterations == '3' && '[1,2,3]' || '[1]') }}
