name: Maven configuration warm path

on:
  workflow_dispatch:
    inputs:
      setup-java-repository:
        description: Repository containing the setup-java action
        required: true
        default: actions/setup-java
        type: string
      baseline-ref:
        description: Git ref containing the baseline implementation
        required: true
        default: main
        type: string
      candidate-ref:
        description: Git ref containing the candidate implementation
        required: true
        default: main
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: maven-configuration-warm-path
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.os }} ${{ matrix.cache }} ${{ matrix.versions.name }} ${{ matrix.toolchains }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        cache: [none, maven, gradle]
        versions:
          - name: single
            java-version: "21"
          - name: multiple
            java-version: |
              17
              21
        toolchains: [empty, existing]
    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out baseline setup-java
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.setup-java-repository }}
          path: baseline
          persist-credentials: false
          ref: ${{ inputs.baseline-ref }}
      - name: Check out candidate setup-java
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.setup-java-repository }}
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.candidate-ref }}

      - name: Record setup dist sizes
        run: |
          bash scripts/benchmark-maven-configuration.sh record-size baseline baseline
          bash scripts/benchmark-maven-configuration.sh record-size candidate candidate

      # The first setup in a job pays DNS resolution, TLS handshakes and a cold
      # page cache that the later ones do not. That is a one-off spike rather
      # than drift, so the mirrored slot order cannot cancel it; this slot pays
      # those costs and is discarded.
      - name: Prepare warm-up slot
        run: bash scripts/benchmark-maven-configuration.sh prepare "${{ matrix.cache }}" "${{ matrix.toolchains }}"
      - name: Warm-up setup (discarded)
        uses: ./baseline
        # A setup that has not finished in three minutes has stalled rather than
        # being slow; failing costs this configuration, which the report drops.
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: ${{ matrix.versions.java-version }}
          cache: ${{ matrix.cache != 'none' && matrix.cache || '' }}
          cache-dependency-path: benchmark/${{ matrix.cache == 'gradle' && 'build.gradle' || 'pom.xml' }}
          settings-path: benchmark-maven-home

      - name: Prepare slot 1
        run: bash scripts/benchmark-maven-configuration.sh prepare "${{ matrix.cache }}" "${{ matrix.toolchains }}"
      - name: Start slot 1 timer
        run: bash scripts/benchmark-maven-configuration.sh start
      - name: Slot 1 setup (baseline)
        uses: ./baseline
        # A setup that has not finished in three minutes has stalled rather than
        # being slow; failing costs this configuration, which the report drops.
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: ${{ matrix.versions.java-version }}
          cache: ${{ matrix.cache != 'none' && matrix.cache || '' }}
          cache-dependency-path: benchmark/${{ matrix.cache == 'gradle' && 'build.gradle' || 'pom.xml' }}
          settings-path: benchmark-maven-home
      - name: Record slot 1
        run: bash scripts/benchmark-maven-configuration.sh record "${{ matrix.os }}" "${{ matrix.cache }}" "${{ matrix.versions.name }}" "${{ matrix.toolchains }}" baseline 1

      - name: Prepare slot 2
        run: bash scripts/benchmark-maven-configuration.sh prepare "${{ matrix.cache }}" "${{ matrix.toolchains }}"
      - name: Start slot 2 timer
        run: bash scripts/benchmark-maven-configuration.sh start
      - name: Slot 2 setup (candidate)
        uses: ./candidate
        # A setup that has not finished in three minutes has stalled rather than
        # being slow; failing costs this configuration, which the report drops.
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: ${{ matrix.versions.java-version }}
          cache: ${{ matrix.cache != 'none' && matrix.cache || '' }}
          cache-dependency-path: benchmark/${{ matrix.cache == 'gradle' && 'build.gradle' || 'pom.xml' }}
          settings-path: benchmark-maven-home
      - name: Record slot 2
        run: bash scripts/benchmark-maven-configuration.sh record "${{ matrix.os }}" "${{ matrix.cache }}" "${{ matrix.versions.name }}" "${{ matrix.toolchains }}" candidate 2

      - name: Prepare slot 3
        run: bash scripts/benchmark-maven-configuration.sh prepare "${{ matrix.cache }}" "${{ matrix.toolchains }}"
      - name: Start slot 3 timer
        run: bash scripts/benchmark-maven-configuration.sh start
      - name: Slot 3 setup (candidate)
        uses: ./candidate
        # A setup that has not finished in three minutes has stalled rather than
        # being slow; failing costs this configuration, which the report drops.
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: ${{ matrix.versions.java-version }}
          cache: ${{ matrix.cache != 'none' && matrix.cache || '' }}
          cache-dependency-path: benchmark/${{ matrix.cache == 'gradle' && 'build.gradle' || 'pom.xml' }}
          settings-path: benchmark-maven-home
      - name: Record slot 3
        run: bash scripts/benchmark-maven-configuration.sh record "${{ matrix.os }}" "${{ matrix.cache }}" "${{ matrix.versions.name }}" "${{ matrix.toolchains }}" candidate 3

      - name: Prepare slot 4
        run: bash scripts/benchmark-maven-configuration.sh prepare "${{ matrix.cache }}" "${{ matrix.toolchains }}"
      - name: Start slot 4 timer
        run: bash scripts/benchmark-maven-configuration.sh start
      - name: Slot 4 setup (baseline)
        uses: ./baseline
        # A setup that has not finished in three minutes has stalled rather than
        # being slow; failing costs this configuration, which the report drops.
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: ${{ matrix.versions.java-version }}
          cache: ${{ matrix.cache != 'none' && matrix.cache || '' }}
          cache-dependency-path: benchmark/${{ matrix.cache == 'gradle' && 'build.gradle' || 'pom.xml' }}
          settings-path: benchmark-maven-home
      - name: Record slot 4
        run: bash scripts/benchmark-maven-configuration.sh record "${{ matrix.os }}" "${{ matrix.cache }}" "${{ matrix.versions.name }}" "${{ matrix.toolchains }}" baseline 4

      - name: Summarize configuration
        run: bash scripts/benchmark-maven-configuration.sh summarize "$GITHUB_STEP_SUMMARY"
      - name: Upload raw benchmark data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maven-config-${{ matrix.os }}-${{ matrix.cache }}-${{ matrix.versions.name }}-${{ matrix.toolchains }}
          path: .benchmark-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  report:
    name: Report
    needs: benchmark
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download configuration timings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: maven-config-*
          path: .benchmark-results
      - name: Generate configuration report
        env:
          SETUP_JAVA_REPOSITORY: ${{ inputs.setup-java-repository }}
          BASELINE_REF: ${{ inputs.baseline-ref }}
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
        run: node scripts/report-maven-configuration.mjs
      - name: Upload benchmark results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maven-configuration-${{ github.run_id }}
          path: maven-config-results/
          retention-days: 30
